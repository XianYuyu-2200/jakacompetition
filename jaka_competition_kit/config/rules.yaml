# 评分规则 —— 与 competition.md 第 5 / 6 节一致
#
# 限时怎么来的: 用 ref_track1 / ref_track2 在目标机器上实跑, 取中位数 × 1.4;
# 效率满分线 = 实测中位数(即"跑得和官方参考实现一样快就给满分")。
#
# 实测(本仓库开发机, vel_scale=1.0, 打开加速度限位后):
#   赛道一 ref_track1  4 轮全部 6/6:  99.7 / 102.7 / 102.8 / 112.8 s
#                      -> 中位数 102.7s -> 限时 145s, 效率满分线 105s
#   赛道二旧任务(12 件同一料盒) 3 轮 12/12: 193.3 / 228.2 / 249.8 s
#                      -> 中位数 228.2s -> 当时限时 320s, 效率满分线 230s
#   赛道二现任务(16 件、四类分拣) 本机 2026-10-13 重标定, 3 轮全部 16/16:
#                      80.94 / 81.27 / 82.05 s -> 中位数 81.3s
#                      限时 = 81.3×1.4 = 113.8, 向上取到 115s(与赛道一 143.8→145 同一口径)
#                      效率满分线取 85s: 不低于中位数, 三轮参考实现都拿满效率分
#
# 换机器/换机械臂/换固件请重新标定, 不要照抄:
#   bash design/calibrate.sh 1 3
#   bash design/calibrate.sh 2 3
track1:
  name: 基础组 · 二维码序令定点抓取赛
  time_limit_s: 145.0
  base:
    per_object: 10.0
    max_objects: 6
  efficiency:
    full_marks_within_s: 105.0
    penalty_per_5s: 4.0
    max: 40.0
  penalties:
    collision: 5.0
    drop: 3.0
    intervention: 10.0
  invalidate_after_interventions: 2
  abort_after_collisions: 3

track2:
  name: 进阶组 · 泛化目标分类抓取赛
  time_limit_s: 115.0          # 中位数 81.3s × 1.4, 向上取到 5 秒
  base:
    per_object: 10.0
    max_objects: 16            # 每类 4 件, 放入对应料盒才计分
  efficiency:
    full_marks_within_s: 85.0   # 中位数向上取到 5 秒, 见文件头
    max: 30.0
  penalties:
    collision: 5.0
    multi_grasp: 10.0
    intervention: 15.0
  max_retries_per_object: 2
  invalidate_after_interventions: 2
  abort_after_collisions: 3

# 判定的几何容差
tolerance:
  grasp_xy_m: 0.045        # 抓取事件必须发生在目标工件 45mm 内
  bin_xy_m: 0.020          # 释放点必须落在料盒内缩 20mm 的范围内
  teleport_xy_m: 0.050     # 相邻两次事件间 TCP 跳变超过此值判定异常
