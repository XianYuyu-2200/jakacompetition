# 赛场定义 —— 唯一真源(single source of truth)
# 尺寸单位: 米(m)。坐标系: 基座安装面中心为原点, +z 向上, +y 指向工位区。
# 任何改动都必须通过 `ros2 run jaka_competition_kit arena_check` 校验。
frame_id: world
base_link: Link_0
tcp_link: dummy_tcp
group_name: jaka_minicobo

# 有效作业带(工具轴竖直向下), 来自 MoveIt 实测, 见 design/规则校核报告.md
work_band:
  r_min: 0.180
  r_max: 0.420
  grasp_heights: [0.03, 0.05, 0.12, 0.20]

# 工具竖直向下的姿态(绕 X 转 180 度)
tool_down_quat: [1.0, 0.0, 0.0, 0.0]

# 机械臂几何 —— 用来校核"末端能不能到"(见 Arena.max_tcp_z)。
# 数值直接量自 jaka_description/urdf/jaka_minicobo.urdf, 对照见
# docs/JAKA-Mini2-参数速查.md。JAKA Mini 2 与 MiniCobo 运动学一致, 臂展 580mm。
arm:
  shoulder_z: 0.187        # joint_1/joint_2 轴线高度 = 可达球心的高度
  upper_plus_forearm: 0.4205   # J2 -> J5(大臂 210 + 小臂 210.5)
  wrist_len: 0.1593        # J5 -> dummy_tcp(沿工具轴)

# 末端几何 —— URDF 里的夹爪必须在这里显式建模, 否则规划器不知道末端有多长
tool:
  # 末端是什么夹爪(默认值; 也可用环境变量 JAKA_GRIPPER=1 临时切到 wheeltec):
  #   none     —— 裸法兰 / 行程几十毫米的小平行夹爪。**规则书规定的就是它**
  #               (《赛题细则》赛道一: 末端执行器 = 电动平行夹爪, 行程 0-30mm),
  #               工件只能吊在法兰下方, 抓取高度由 flange_height 决定。
  #   wheeltec —— WHEELTEC MS42DC 二指柔性爪(见 jaka_ros2/src/wheeltec_gripper)。
  #               165mm 高、97mm 长的手指, 工件是**夹在两片指之间**的,
  #               抓取高度由 tip_depth(法兰面->刀尖 164.6mm)决定 ——
  #               比裸法兰(按 40mm 安装余量算)高 **~74mm**。
  #
  # 换末端必须同时改三处, 否则会撞工件/撞台面:
  #   1) 这里(抓取/转场/投放高度)
  #   2) URDF: xacro ... with_gripper:=true(环境变量 JAKA_GRIPPER=1)
  #   3) 夹爪控制器: ros2 launch ... use_gripper:=true
  #
  # ⚠ 可达性: wheeltec 的 164.6mm 刀尖把抓取高度抬到 173.6mm, 预抓取悬停
  #   (再 +35mm)到 208.6mm, 而 580mm 臂展的机械臂在 r=385mm 处工具朝下最多只到
  #   195.9mm(见 Arena.max_tcp_z)。工位4/6 的**预抓取悬停**和"原地竖直抬到
  #   转场高度(232.6mm)"都超了。参考实现不用改布局就能绕开:
  #     * 悬停压到该半径上限(clamp_tcp_z) —— 够不到位姿会让 IK 无解, 规划器
  #       于是随机挑关节解(实测挑到 J4/J6 翻 180° 的腕部另一支, 整轮翻腕);
  #     * 转场走 L 形: 先原地抬到上限 -> 沿半径朝基座内收 -> 再抬到转场高度
  #       (见 reach_pull_margin 与 Executor.pick_and_place)。
  #   实测柔性爪跑完整轮赛道一 6/6、顺序正确、69.6s、100.0 分。
  #   跑 `ros2 run jaka_competition_kit arena_check` 会逐点报出这些高度;
  #   详见 docs/WHEELTEC柔性机械爪.md 第 4 节。
  gripper: none
  # TCP(法兰面)往下假想的末端高度 —— 只有 gripper: none 时用。
  # **工具轴是 +z**: dummy_tcp 与 Link_6 同原点, Link_6 网格 z∈[-39, 0],
  # 臂的材料整个在法兰后面(-z), z=0 就是法兰贴合面, 外侧没有任何实体。
  # 这里的 40mm 不是量出来的, 而是**假装末端装了一只 40mm 高的小平行夹爪**
  # (规则书要求的那只), 于是工件顶面吊在法兰下方 40+6mm —— 纯保守余量,
  # 真机上按实际夹爪改。
  flange_height: 0.040
  # 工件顶面到法兰底面的安全间隙(gripper: none 时用)
  clearance: 0.006
  # --- gripper: wheeltec 专用 ---
  # TCP(法兰面)到夹爪最低点(两片指的刀尖)的距离。实测自 3D 模型, 与
  # jaka_ros2/src/wheeltec_gripper/config/gripper.yaml 的 tip_depth 必须一致。
  tip_depth: 0.1646
  # 刀尖离"工件底面所在平面"的余量(= 抓取时刀尖离台面/工位板的余量)。
  # 不能压到 3mm 以下: 位置约束和 TF 抖动会把它吃掉 -> 刀尖戳进工位板。
  tip_clearance: 0.005
  # 手指张合(实测自 3D 模型): 离法兰面 120.3mm 的参考深度上, 张开时指间
  # 净距 70.3mm, 每闭合 1° 净距减少 1.303mm, 最多合 35.9°(再合两片指就
  # 互相干涉) —— 也就是能夹 24~70mm 宽的工件。
  # 仿真夹爪按这些数把"工件尺寸"换算成手指角度, 见 gripper.py 的 SimGripper。
  jaw_gap_open: 0.07033
  jaw_gap_per_deg: 0.001303
  jaw_limit_deg: 35.86
  # 夹紧时比工件再多留的缝(纯视觉: 免得手指看起来插进工件里)
  jaw_gap_extra: 0.004
  # 预抓取点比抓取点再抬高多少
  approach_lift: 0.035
  # L 形转场(长末端在远端工位原地竖直抬不到转场高度时, 先抬到该半径上限 ->
  # 沿半径朝基座内收 -> 再抬起来; 见 Executor.pick_and_place)留的安全余量。
  # 内收目标半径按 radius_for_tcp_z(转场高度 + 本值) 反算 —— 留 10mm 是为了让
  # 内收终点本身还有 10mm 高度余量, 免得刚好卡在可达边界上规划不出来。
  reach_pull_margin: 0.010
  # 料盒底板厚度(工件要落在它上面)
  bin_floor: 0.008
  # 释放时工件底面离料盒底板的最小间隙。
  # 不能太小: MoveIt 的位置约束是个 5mm 的球, 实际落点可能偏低,
  # 3mm 的余量会被吃掉 -> 工件与料盒底板报碰撞 -> 规划直接返回
  # INVALID_MOTION_PLAN(-2)。留 12mm 等价于"离底 12mm 松手让它掉下去",
  # 真实作业里本来也是这么放的。
  release_margin: 0.012
  # 抬着工件转场时, 工件**底面**越过障碍顶面要留的间隙。
  # 这是转场高度唯一的可调余量: 高度 = 障碍最高点 + 本值 + 末端最低点
  # 到工件底面的距离(见 Arena.transfer_tcp_z())。
  # 不能压到 5mm 以下 —— 位置约束与 TF 抖动会把它吃掉, 关节空间的直线又会
  # 撞到邻件而退回 OMPL 绕大弧(那才是看起来"抬得高"的真正原因)。
  transfer_margin: 0.010
  # 附着工件后允许与之接触的连杆(不参与碰撞) —— 必须显式列出,
  # 否则工件会一直和法兰/腕部报碰撞
  # 末端夹爪的三个 link 也要列进来: 工件就是被手指夹住的, 不豁免的话
  # MoveIt 会认为"附着工件与手指碰撞", 之后所有规划都返回失败
  touch_links: [dummy_tcp, gripper_base, gripper_jaw_l, gripper_jaw_r,
                Link_6, Link_5, Link_4]

# 安全复位位姿(所有失败处理都退回这里)
home:
  xy: [0.0, 0.280]
  z: 0.220

table:
  center: [-0.02, 0.30]
  size: [0.90, 0.70]
  thickness: 0.02
  top_z: -0.001          # 台面略低于基座安装面, 避免贴面误判

track1:
  station_pitch: 0.150
  array_center_r: 0.280
  station_size: 0.100
  station_thickness: 0.003
  # 料盒只按**中心**判可达性(工件就投在中心点上), 外缘允许超出作业带。
  # 尺寸不能再小: 150x100 的内腔(130x80)连 6 个 50mm 方块都放不下,
  # 而且侧墙离工件只有 15mm, RRTConnect 末段甩一下就把工件怼到墙上
  # (报 "Computed path is not valid"), 表现为 place 时好时坏。
  # 200x150 内腔 180x130: 放得下 6 件, 侧墙余量 40-65mm。
  bin:
    center: [0.315, 0.180]
    size: [0.200, 0.150]
    height: 0.040
  qr:
    center: [0.0, 0.110]
    size: 0.060
  # 抓取时 TCP 的高度不写死: 由场景生成器按工件实际中心高度给出(见 scene 真值里的 z)
  # release_z 不写死: 由 release_tcp_z() 按工件尺寸算
  workpieces:
    - {id: cube,     name: 正方体,   size: 0.050}
    - {id: rod,      name: 长方体,   size: 0.050}
    - {id: cylinder, name: 圆柱体,   size: 0.050}
    - {id: hex,      name: 六角柱,   size: 0.050}
    - {id: tri,      name: 三角柱,   size: 0.050}
    - {id: cone,     name: 圆台,     size: 0.050}

track2:
  scatter:
    # 矩形散放区 x[-175,175] y[190,350] mm。
    #   最近点 (0,190)      r = 190mm  -> 在下界 180mm 之外, 且不在基座本体上
    #   最远角 (175,350)    r = 391mm  -> 距上界 420mm 留 29mm 余量
    # 注意: 判据是"最近点"而不是"近角"。若取 center_y=230/size_y=250,
    # 近边中点 (0,105) 只有 r=105mm —— 落在基座回转体里, 抓不到;
    # MoveIt 用 /compute_ik 实测该点确实无解(见 design/scatter_probe.py)。
    # 还要管"预抓取高度": 工件越高, 预抓取点越高(z=size+81mm), 可达半径越小。
    # 本区间在 z=166mm 处实测仍整块可达。
    center: [0.0, 0.270]
    size: [0.350, 0.160]   # x 向 350mm, y 向 160mm
  bin:
    center: [0.310, 0.200]
    size: [0.200, 0.150]
    height: 0.100
  objects_total: 20
  objects_per_round: 12
  min_gap: 0.010           # 工件之间最小间隙
  object_size_range: [0.035, 0.075]
  # release_z 由 release_tcp_z() 按工件尺寸算
