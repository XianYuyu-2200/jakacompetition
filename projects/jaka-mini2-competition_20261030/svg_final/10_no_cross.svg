<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA" /><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 机器人应用挑战赛</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">10 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4" /><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">假硬件 102.7 秒，Gazebo 为 209.4 秒</text><rect x="56" y="160" width="560" height="250" fill="#E6E2D6" /><rect x="664" y="160" width="560" height="250" fill="#C4372A" /><text x="80" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5C584E">假硬件 · 计分参照</text><text x="80" y="300" font-family="Georgia, SimSun, serif" font-size="48" fill="#1A1A1A">102.7</text><text x="360" y="300" font-family="SimSun, Georgia, serif" font-size="28" fill="#1A1A1A">秒</text><text x="688" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#F4F1EA">Gazebo · 物理仿真</text><text x="688" y="300" font-family="Georgia, SimSun, serif" font-size="48" fill="#F4F1EA">209.4</text><text x="980" y="300" font-family="SimSun, Georgia, serif" font-size="28" fill="#F4F1EA">秒</text><text font-family="Microsoft YaHei, Arial, sans-serif" fill="#242424" font-size="24" x="56" y="460">同一套赛道一参考实现。假硬件中的轨迹为瞬时到位。</text><text font-family="Microsoft YaHei, Arial, sans-serif" fill="#242424" font-size="24" x="56" y="500">Gazebo 中关节须按实际速度完成运动，并等待物理收敛。</text><text font-family="Microsoft YaHei, Arial, sans-serif" fill="#242424" font-size="24" x="56" y="540">因此，上述限时不得直接用于 Gazebo 仿真或真机比赛。</text><text font-family="Microsoft YaHei, Arial, sans-serif" fill="#242424" font-size="24" x="56" y="580">镜像可为 6/6，46 个实体与规划场景一致，但不改变限时口径。</text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4" /><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">依据：仓库说明中的已验证范围。赛道一 Gazebo 参考实现用时 209.4 秒。</text></svg>