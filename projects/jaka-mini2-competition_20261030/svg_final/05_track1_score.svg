<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 机器人应用挑战赛</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">05 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">赛道一满分为 100 分，限时 145 秒</text><text x="56" y="170" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">满分</text><text x="56" y="230" font-family="Georgia, SimSun, serif" font-size="48" fill="#1A1A1A">100</text><text x="210" y="230" font-family="SimSun, Georgia, serif" font-size="28" fill="#1A1A1A">分</text><text x="360" y="170" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">限时</text><text x="360" y="230" font-family="Georgia, SimSun, serif" font-size="48" fill="#1A1A1A">145</text><text x="530" y="230" font-family="SimSun, Georgia, serif" font-size="28" fill="#1A1A1A">秒</text><text x="700" y="170" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">效率满分线</text><text x="700" y="230" font-family="Georgia, SimSun, serif" font-size="48" fill="#2F5D8C">105</text><text x="870" y="230" font-family="SimSun, Georgia, serif" font-size="28" fill="#2F5D8C">秒</text><rect x="56" y="270" width="1168" height="1" fill="#C8C2B4"/><!-- icon: phosphor-duotone/target -->
