<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#F4F1EA"/><rect x="0" y="0" width="1280" height="8" fill="#1A1A1A"/><text x="56" y="64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">JAKA MINI 2  ·  机器人应用挑战赛</text><text x="56" y="176" font-family="SimSun, Georgia, serif" font-size="48" fill="#1A1A1A">初赛与决赛共用同一赛场<tspan x="56" dy="64">限时口径不得跨线复用</tspan></text><text x="56" y="328" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#242424">初赛仿真与决赛真机采用同一赛场几何及同一套评分程序。</text><rect x="56" y="368" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="430" font-family="Georgia, SimSun, serif" font-size="14" fill="#2F5D8C">01</text><text x="56" y="468" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">赛场几何统一</text><text x="56" y="508" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#242424">初赛与决赛共用 arena.yaml 及评分程序。</text><text x="456" y="430" font-family="Georgia, SimSun, serif" font-size="14" fill="#2F5D8C">02</text><text x="456" y="468" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">限时按中位数标定</text><text x="456" y="508" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#242424">赛道一 145 秒，赛道二 115 秒。</text><text x="856" y="430" font-family="Georgia, SimSun, serif" font-size="14" fill="#2F5D8C">03</text><text x="856" y="468" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">禁止跨线复用</text><text x="856" y="508" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#242424">假硬件成绩不得直接用于 Gazebo 或真机。</text><rect x="56" y="560" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="608" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">判分依据为 MoveIt 规划场景。</text><text x="56" y="644" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">Gazebo 仅用于显示，不参与判分。</text></svg>
