<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 机器人应用挑战赛</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">05 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">赛道一满分为 100 分，限时 145 秒</text><text x="56" y="170" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">满分</text><text x="56" y="230" font-family="Georgia, SimSun, serif" font-size="48" fill="#1A1A1A">100</text><text x="210" y="230" font-family="SimSun, Georgia, serif" font-size="28" fill="#1A1A1A">分</text><text x="360" y="170" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">限时</text><text x="360" y="230" font-family="Georgia, SimSun, serif" font-size="48" fill="#1A1A1A">145</text><text x="530" y="230" font-family="SimSun, Georgia, serif" font-size="28" fill="#1A1A1A">秒</text><text x="700" y="170" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">效率满分线</text><text x="700" y="230" font-family="Georgia, SimSun, serif" font-size="48" fill="#2F5D8C">105</text><text x="870" y="230" font-family="SimSun, Georgia, serif" font-size="28" fill="#2F5D8C">秒</text><rect x="56" y="270" width="1168" height="1" fill="#C8C2B4"/><use data-icon="phosphor-duotone/target" x="56" y="300" width="36" height="36" fill="#1A1A1A"/><text x="112" y="328" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">基础分 60</text><text x="280" y="328" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#242424">按二维码顺序，每成功入盒 1 件得 10 分。跳序、错序不计该件。</text><use data-icon="phosphor-duotone/gauge" x="56" y="380" width="36" height="36" fill="#1A1A1A"/><text x="112" y="408" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">效率分 40</text><text x="280" y="408" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#242424">105 秒内完赛得满分；超出后每 5 秒扣 4 分，直至扣完。</text><use data-icon="phosphor-duotone/warning" x="56" y="460" width="36" height="36" fill="#C4372A"/><text x="112" y="488" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">扣分</text><text x="280" y="488" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#242424">碰撞每次扣 5 分，掉落每件扣 3 分，干预每次扣 10 分。</text><text x="56" y="600" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5C584E">参考实现四轮均为 6/6，用时中位数 102.7 秒。</text><text x="56" y="632" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5C584E">干预累计 2 次，成绩无效。赛前调试期间的抓取不计成绩。</text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">依据：赛题细则与仓库说明。几何真源为 arena.yaml。</text></svg>
