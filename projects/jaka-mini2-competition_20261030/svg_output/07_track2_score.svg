<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 机器人应用挑战赛</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">07 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">赛道二满分为 190 分，限时 115 秒</text><text x="56" y="200" font-family="Georgia, SimSun, serif" font-size="48" fill="#1A1A1A">190</text><text x="56" y="236" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">满分</text><text x="360" y="200" font-family="Georgia, SimSun, serif" font-size="48" fill="#1A1A1A">115</text><text x="360" y="236" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">限时（秒）</text><text x="680" y="200" font-family="Georgia, SimSun, serif" font-size="48" fill="#1A1A1A">85</text><text x="680" y="236" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">效率满分（秒）</text><text x="980" y="200" font-family="Georgia, SimSun, serif" font-size="48" fill="#1A1A1A">16</text><text x="980" y="236" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">上场件数</text><rect x="56" y="270" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="310" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">基础分 160</text><text x="280" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#242424">放入对应类别料盒，每件得 10 分。放错料盒不计分。</text><text x="56" y="374" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">效率分 30</text><text x="280" y="374" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#242424">85 秒内得满分；其后按超时比例折算，115 秒为 0 分。</text><text x="56" y="438" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">创新加分</text><text x="280" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#242424">加 5 至 20 分。适用于无需预先标注模型的端到端方案。</text><text x="56" y="502" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">扣分</text><text x="280" y="502" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#242424">碰撞每次扣 5 分，单次多抓扣 10 分，干预每次扣 15 分。</text><text x="56" y="600" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5C584E">参考实现三轮均为 16/16，中位数 81.3 秒。</text><text x="56" y="632" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5C584E">其类别取自场景真值，不代表视觉分类成绩。干预累计 2 次，成绩无效。</text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">依据：赛题细则与仓库说明。几何真源为 arena.yaml。</text></svg>
