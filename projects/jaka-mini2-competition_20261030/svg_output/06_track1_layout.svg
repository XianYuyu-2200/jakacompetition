<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 机器人应用挑战赛</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">06 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">赛道一仅设置一个料盒</text><image href="../images/fig_arena_track1.png" x="56" y="150" width="520" height="416" preserveAspectRatio="xMidYMid meet"/><text x="56" y="586" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">附图：赛道一平面布置</text><text x="620" y="164" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">工位 1–6</text><text x="620" y="202" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">近排为 1、2、3，远排为 4、5、6。<tspan x="620" dy="28">阵列中心 y=280，间距 150 mm。</tspan></text><text x="620" y="282" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">料盒</text><text x="620" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">中心 (315, 180)，外形 200×150×40。<tspan x="620" dy="28">内腔不得缩小为 150×100。</tspan></text><text x="620" y="400" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">二维码</text><text x="620" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">中心 (0, 110)，半径 110 mm。<tspan x="620" dy="28">由俯视相机读取，机械臂无需到达。</tspan></text><text x="620" y="518" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">布置限制</text><text x="620" y="556" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">与赛道二设施存在平面重叠。<tspan x="620" dy="28">不得同时放入规划场景。</tspan></text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">依据：赛题细则与仓库说明。几何真源为 arena.yaml。</text></svg>
