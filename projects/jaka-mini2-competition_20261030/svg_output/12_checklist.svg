<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 机器人应用挑战赛</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">12 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">赛前请核对以下六项</text><text x="56" y="170" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">01</text><text x="128" y="170" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">几何真源</text><text x="128" y="212" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">仅以 arena.yaml 为准。修改后须运行 arena_check。</text><text x="640" y="170" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">02</text><text x="712" y="170" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">当前赛道</text><text x="712" y="212" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">现场仅布置本赛道的料盒与工位。</text><text x="56" y="330" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">03</text><text x="128" y="330" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">限时口径</text><text x="128" y="372" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">仅采用本线路中位数的 1.4 倍。</text><text x="640" y="330" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">04</text><text x="712" y="330" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">末端夹爪</text><text x="712" y="372" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">默认小平行夹爪。更换柔性爪后须重算高度。</text><text x="56" y="490" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">05</text><text x="128" y="490" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">安全要求</text><text x="128" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">真机须保留独立急停。速度缩放不超过 50%。</text><text x="640" y="490" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">06</text><text x="712" y="490" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">成绩认定</text><text x="712" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">调试抓取不计成绩。干预累计 2 次，本轮无效。</text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">请按上述六项完成赛前核对。数据以赛题细则及仓库说明为准。</text></svg>
