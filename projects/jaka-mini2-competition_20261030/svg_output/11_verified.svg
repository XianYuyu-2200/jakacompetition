<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 机器人应用挑战赛</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">11 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">已验证的是规划场景，不是真机成绩</text><use data-icon="phosphor-duotone/check-circle" x="56" y="150" width="36" height="36" fill="#2F5D8C"/><text x="112" y="178" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">URDF 与 TF</text><text x="420" y="178" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">4 个位姿，误差 0.000 mm。</text><use data-icon="phosphor-duotone/check-circle" x="56" y="228" width="36" height="36" fill="#2F5D8C"/><text x="112" y="256" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">MoveIt 假硬件</text><text x="420" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">规划与执行成功，共 29 个轨迹点。</text><use data-icon="phosphor-duotone/check-circle" x="56" y="306" width="36" height="36" fill="#2F5D8C"/><text x="112" y="334" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">Gazebo 物理仿真</text><text x="420" y="334" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">规划与执行成功，共 32 个轨迹点。</text><use data-icon="phosphor-duotone/check-circle" x="56" y="384" width="36" height="36" fill="#2F5D8C"/><text x="112" y="412" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">赛场镜像</text><text x="420" y="412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">赛道一整轮 6/6，46 个实体一致。</text><use data-icon="phosphor-duotone/warning" x="56" y="462" width="36" height="36" fill="#C4372A"/><text x="112" y="490" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">限时不得混用</text><text x="420" y="490" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">Gazebo 209.4 秒，假硬件 102.7 秒。</text><text x="56" y="620" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5C584E">柔性爪自法兰至刀尖 164.6 mm。工位 4、6 的原悬停高度超出上限，须调整路径后再标定。</text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">依据：赛题细则与仓库说明。几何真源为 arena.yaml。</text></svg>
