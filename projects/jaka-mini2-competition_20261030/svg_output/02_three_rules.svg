<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 机器人应用挑战赛</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">02 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">请先确认三项基本规则</text><rect x="56" y="160" width="1168" height="140" fill="#E6E2D6"/><use data-icon="phosphor-duotone/number-circle-one" x="80" y="206" width="44" height="44" fill="#1A1A1A"/><text x="148" y="218" font-family="SimSun, Georgia, serif" font-size="28" fill="#1A1A1A">判分以规划场景为准</text><text x="148" y="262" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">MoveIt 规划场景为几何真源。Gazebo 仅为可选显示，不参与判分。</text><rect x="56" y="316" width="1168" height="140" fill="#E6E2D6"/><use data-icon="phosphor-duotone/number-circle-two" x="80" y="362" width="44" height="44" fill="#1A1A1A"/><text x="148" y="374" font-family="SimSun, Georgia, serif" font-size="28" fill="#1A1A1A">限时按中位数的 1.4 倍确定</text><text x="148" y="418" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">以参考实现实测中位数为基准。赛道一 102.7 秒，赛道二 81.3 秒。</text><rect x="56" y="472" width="1168" height="140" fill="#E6E2D6"/><use data-icon="phosphor-duotone/number-circle-three" x="80" y="518" width="44" height="44" fill="#1A1A1A"/><text x="148" y="530" font-family="SimSun, Georgia, serif" font-size="28" fill="#1A1A1A">更换线路或夹爪后须重新标定</text><text x="148" y="574" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">假硬件、Gazebo 与真机不得共用同一组限时。</text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">依据：赛题细则与仓库说明。几何真源为 arena.yaml。</text></svg>
