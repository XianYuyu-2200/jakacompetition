<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#F4F1EA"/><rect x="0" y="0" width="1280" height="8" fill="#1A1A1A"/><text x="56" y="64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">JAKA MINI 2  ·  机器人应用挑战赛</text><text x="56" y="180" font-family="SimSun, Georgia, serif" font-size="48" fill="#1A1A1A">同一份赛场，<tspan x="56" dy="64">两套限时不能混用</tspan></text><text x="56" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#242424">初赛仿真和决赛真机，用同一份赛场、同一套评分。</text><rect x="56" y="368" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="430" font-family="Georgia, SimSun, serif" font-size="14" fill="#2F5D8C">01</text><text x="56" y="468" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">共用 arena.yaml</text><text x="56" y="506" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#242424">初赛和决赛同一份几何，同一套评分程序。</text><text x="456" y="430" font-family="Georgia, SimSun, serif" font-size="14" fill="#2F5D8C">02</text><text x="456" y="468" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">限时 = 中位数 × 1.4</text><text x="456" y="506" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#242424">赛道一 145 秒，赛道二 115 秒。</text><text x="856" y="430" font-family="Georgia, SimSun, serif" font-size="14" fill="#2F5D8C">03</text><text x="856" y="468" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">不能跨线复用</text><text x="856" y="506" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#242424">假硬件成绩不能直接用于 Gazebo 或真机。</text><rect x="56" y="560" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="600" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5C584E">10–15 分钟赛前说明  ·  会后按页核对</text><text x="56" y="640" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">判分只看 MoveIt 规划场景。Gazebo 只出画面，不参与判分。</text></svg>
