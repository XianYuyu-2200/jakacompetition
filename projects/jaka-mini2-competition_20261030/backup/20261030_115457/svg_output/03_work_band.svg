<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 比赛说明</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">03 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">竖直下抓只在 180–420 mm</text><text x="56" y="156" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">工具轴竖直向下。超出这条带，compute_ik 无解。</text><text x="56" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">抓取高度</text><text x="220" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">可达半径</text><rect x="56" y="228" width="520" height="1" fill="#C8C2B4"/><text x="56" y="264" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#1A1A1A">30 mm</text><text x="220" y="264" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">180 – 420 mm</text><rect x="56" y="280" width="520" height="1" fill="#C8C2B4"/><text x="56" y="316" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#1A1A1A">120 mm</text><text x="220" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">155 – 406 mm</text><rect x="56" y="332" width="520" height="1" fill="#C8C2B4"/><text x="56" y="368" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#1A1A1A">200 mm</text><text x="220" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">85 – 380 mm</text><rect x="56" y="384" width="520" height="1" fill="#C8C2B4"/><text x="56" y="424" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#242424">点目标看中心，料盒外缘可以出带。<tspan x="56" dy="32">矩形要看最近点和最远角。</tspan><tspan x="56" dy="32">最近点必须 ≥ 180 mm。</tspan><tspan x="56" dy="32">倾斜抓取上限 459 mm，不建议。</tspan></text><image href="../images/reach_envelope.png" x="700" y="168" width="480" height="373" preserveAspectRatio="xMidYMid meet"/><text x="700" y="560" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">仓库图 design/reach_envelope.png</text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">来源：赛题细则与仓库 README。几何真源是 arena.yaml。</text></svg>
