<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 机器人应用挑战赛</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">03 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">竖直下抓的有效作业带为 180–420 mm</text><text x="56" y="156" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">工具轴保持竖直向下。超出该作业带时，逆运动学无解。</text><text x="56" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">抓取高度</text><text x="220" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5C584E">可达半径</text><rect x="56" y="228" width="520" height="1" fill="#C8C2B4"/><text x="56" y="264" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#1A1A1A">30 mm</text><text x="220" y="264" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">180 – 420 mm</text><rect x="56" y="280" width="520" height="1" fill="#C8C2B4"/><text x="56" y="316" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#1A1A1A">120 mm</text><text x="220" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">155 – 406 mm</text><rect x="56" y="332" width="520" height="1" fill="#C8C2B4"/><text x="56" y="368" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#1A1A1A">200 mm</text><text x="220" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">85 – 380 mm</text><rect x="56" y="384" width="520" height="1" fill="#C8C2B4"/><text x="56" y="424" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#242424">点目标以中心判定，料盒外缘可超出作业带。<tspan x="56" dy="32">矩形区域须同时满足最近点与最远角。</tspan><tspan x="56" dy="32">最近点不得小于 180 mm。</tspan><tspan x="56" dy="32">倾斜抓取上限为 459 mm，不宜采用。</tspan></text><image href="../images/reach_envelope.png" x="700" y="168" width="480" height="373" preserveAspectRatio="xMidYMid meet"/><text x="700" y="560" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">附图：竖直下抓可达范围</text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">依据：赛题细则与仓库说明。几何真源为 arena.yaml。</text></svg>
