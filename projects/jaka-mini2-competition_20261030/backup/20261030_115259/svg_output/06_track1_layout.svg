<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 比赛说明</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">06 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">赛道一只摆一只料盒</text><image href="../images/fig_arena_track1.png" x="56" y="150" width="520" height="416" preserveAspectRatio="xMidYMid meet"/><text x="56" y="586" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">design/fig_arena_track1.png</text><text x="620" y="168" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">工位 1–6</text><text x="620" y="204" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">近排 1、2、3，远排 4、5、<tspan x="620" dy="28">6。中心 y=280，间距 15</tspan><tspan x="620" dy="28">0 mm。</tspan></text><text x="620" y="278" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">一只料盒</text><text x="620" y="314" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">中心 (315, 180)。外形<tspan x="620" dy="28"> 200×150×40。内腔不要</tspan><tspan x="620" dy="28">做成 150×100。</tspan></text><text x="620" y="388" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">二维码</text><text x="620" y="424" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">中心 (0, 110)，r=11<tspan x="620" dy="28">0 mm。俯拍读取，手臂不必过去</tspan><tspan x="620" dy="28">。</tspan></text><text x="620" y="498" font-family="SimSun, Georgia, serif" font-size="22" fill="#1A1A1A">不要同时摆</text><text x="620" y="534" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">和赛道二的料盒、工位板、散放区重<tspan x="620" dy="28">叠，会挡住入盒。</tspan></text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">来源：赛题细则与仓库 README。几何真源是 arena.yaml。</text></svg>
