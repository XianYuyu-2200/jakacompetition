<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 比赛说明</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">09 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">145 秒和 115 秒都是中位数 × 1.4</text><rect x="56" y="156" width="1168" height="56" fill="#1A1A1A"/><text x="80" y="192" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#F4F1EA">赛道</text><text x="280" y="192" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#F4F1EA">中位数</text><text x="560" y="192" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#F4F1EA">限时 × 1.4</text><text x="880" y="192" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#F4F1EA">效率满分线</text><rect x="56" y="212" width="1168" height="88" fill="#E6E2D6"/><text x="80" y="268" font-family="SimSun, Georgia, serif" font-size="28" fill="#1A1A1A">一 · 6 件</text><text x="280" y="268" font-family="Georgia, SimSun, serif" font-size="28" fill="#1A1A1A">102.7 秒</text><text x="560" y="268" font-family="Georgia, SimSun, serif" font-size="28" fill="#1A1A1A">145 秒</text><text x="880" y="268" font-family="Georgia, SimSun, serif" font-size="28" fill="#1A1A1A">105 秒</text><rect x="56" y="300" width="1168" height="88" fill="#E6E2D6"/><text x="80" y="356" font-family="SimSun, Georgia, serif" font-size="28" fill="#1A1A1A">二 · 16 件</text><text x="280" y="356" font-family="Georgia, SimSun, serif" font-size="28" fill="#1A1A1A">81.3 秒</text><text x="560" y="356" font-family="Georgia, SimSun, serif" font-size="28" fill="#1A1A1A">115 秒</text><text x="880" y="356" font-family="Georgia, SimSun, serif" font-size="28" fill="#1A1A1A">85 秒</text><text x="56" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#242424">赛道一样本：99.7 / 102.7 / 102.8 / 112.8 秒，四轮都是 6/6。<tspan x="56" dy="36">赛道二样本：80.94 / 81.27 / 82.05 秒，三轮都是 16/16。</tspan><tspan x="56" dy="36">测在打开关节加速度限位、vel_scale=1.0 的假硬件线上。</tspan><tspan x="56" dy="36">换机器、换臂、换固件：bash design/calibrate.sh &lt;赛道&gt; 3，再改 rules.yaml。</tspan></text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">来源：赛题细则与仓库 README。几何真源是 arena.yaml。</text></svg>
