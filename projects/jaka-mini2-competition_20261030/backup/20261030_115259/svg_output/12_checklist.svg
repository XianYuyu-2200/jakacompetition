<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#F4F1EA"/><text x="56" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">JAKA Mini 2 比赛说明</text><text x="1224" y="40" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E" text-anchor="end">12 / 12</text><rect x="56" y="54" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="108" font-family="SimSun, Georgia, serif" font-size="36" fill="#1A1A1A">上场前核对这六项</text><text x="56" y="170" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">01</text><text x="112" y="170" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">几何</text><text x="112" y="212" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">只认 arena.yaml。改尺寸后跑 arena_check。</text><text x="640" y="170" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">02</text><text x="696" y="170" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">当前赛道</text><text x="696" y="212" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">只摆这一条赛道的料盒和工位。</text><text x="56" y="330" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">03</text><text x="112" y="330" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">限时口径</text><text x="112" y="372" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">只用这条线的中位数 × 1.4。</text><text x="640" y="330" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">04</text><text x="696" y="330" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">夹爪</text><text x="696" y="372" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">默认真平行爪。换柔性爪要重算高度。</text><text x="56" y="490" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">05</text><text x="112" y="490" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">急停</text><text x="112" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">真机保留独立急停。速度缩放 ≤ 50%。</text><text x="640" y="490" font-family="Georgia, SimSun, serif" font-size="18" fill="#C4372A">06</text><text x="696" y="490" font-family="SimSun, Georgia, serif" font-size="24" fill="#1A1A1A">成绩</text><text x="696" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#242424">调试抓取不计分。干预累计 2 次无效。</text><rect x="56" y="668" width="1168" height="1" fill="#C8C2B4"/><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5C584E">把这六项交给下一班。数字以赛题细则和 README 为准。</text></svg>
